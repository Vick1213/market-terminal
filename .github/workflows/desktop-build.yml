# Builds the Tauri desktop app (apps/desktop) for macOS and Windows.
#
# Unsigned builds: there is no Apple code signing/notarization or Windows
# code signing wired up yet - that's tracked for a later milestone (M6, see
# PRODUCT.md). Bundles produced here are ad-hoc/unsigned.
#
# The macOS artifact is arm64-only for now (Apple Silicon `macos-latest`
# runners) - no Intel (x86_64) build in this workflow yet.
name: desktop-build

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Reads packageManager from the root package.json (pnpm@9.15.9) - no
      # version input needed.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs `beforeBuildCommand` (static-exports apps/web) then `tauri
      # build` for apps/desktop. On a `v*` tag push, tagName/releaseName are
      # non-empty and tauri-action creates/updates a draft GitHub release
      # and uploads the bundles to it; on any other trigger (e.g. a manual
      # workflow_dispatch run) tagName is an empty string, which tauri-action
      # treats as "no release" and it only builds the app (verified against
      # tauri-apps/tauri-action's src/index.ts: release creation/upload is
      # gated behind `if (tagName && !releaseId)`).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'Market Terminal v__VERSION__' || '' }}
          releaseDraft: true

      # Always upload the built bundles as workflow artifacts too, so a
      # workflow_dispatch run without a tag still yields downloadable
      # installers from the run's summary page.
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: market-terminal-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*
            apps/desktop/src-tauri/target/release/bundle/macos/*
            apps/desktop/src-tauri/target/release/bundle/msi/*
            apps/desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: ignore

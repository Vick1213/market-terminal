[project]
name = "market-api"
version = "0.1.0"
description = "FastAPI backend for the local market-intelligence terminal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "apscheduler>=3.10,<4",
    "duckdb>=1.1",
    "httpx>=0.27",
    "aiolimiter>=1.1",
    "tenacity>=9.0",
    "diskcache>=5.6",
    "feedparser>=6.0",
    "torch>=2.4",
    "transformers>=4.45",
    "einops>=0.8",
    "tqdm>=4.66",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
    "pandas>=2.2",
    "xlrd>=2.0",
    "openpyxl>=3.1",
    "yfinance>=1.4.1",
    "ccxt>=4.4",
]

[dependency-groups]
dev = [
    "honcho>=2.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored Kronos inference code — keep byte-identical to upstream, don't lint.
extend-exclude = ["app/forecast/kronos"]

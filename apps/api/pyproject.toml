[project]
name = "market-api"
version = "0.1.0"
description = "FastAPI backend for the local market-intelligence terminal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "apscheduler>=3.10,<4",
    "duckdb>=1.1",
    "httpx>=0.27",
    "aiolimiter>=1.1",
    "tenacity>=9.0",
    "diskcache>=5.6",
    "feedparser>=6.0",
    "torch>=2.4",
    "transformers>=4.45",
    "einops>=0.8",
    "tqdm>=4.66",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
    "pandas>=2.2",
    "xlrd>=2.0",
    "openpyxl>=3.1",
    "yfinance>=1.4.1",
    "ccxt>=4.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "lightgbm>=4.6.0",
]

[dependency-groups]
dev = [
    "honcho>=2.0",
    "ruff>=0.8",
    "pytest>=8.0",
]
# Desktop packaging (M2): freezes sidecar_main.py into a PyInstaller onedir
# sidecar for the Tauri app. Install with `uv sync --group bundle`, run with
# `uv run --group bundle pyinstaller ...` (see sidecar.spec + ../desktop/scripts/build-sidecar.mjs).
# Not a normal runtime dep — dev/CI machines building the desktop app only.
bundle = [
    "pyinstaller>=6.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored Kronos inference code — keep byte-identical to upstream, don't lint.
extend-exclude = ["app/forecast/kronos"]
